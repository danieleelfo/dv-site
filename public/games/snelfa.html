<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SNAKEEE_</title>
<style>
  :root{
    --bg:#06140a;
    --bg2:#0a1f10;
    --phosphor:#4dff7a;
    --phosphor-dim:#1f7a3d;
    --amber:#ffb000;
    --crt-line: rgba(77,255,122,0.04);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; height:100%;
    background: radial-gradient(ellipse at center, var(--bg2) 0%, var(--bg) 70%);
    color:var(--phosphor);
    font-family: 'Courier New', 'Lucida Console', monospace;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  #screen{
    position:relative;
    width:100%; max-width:480px;
    padding:18px;
  }
  .crt-overlay{
    pointer-events:none;
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      var(--crt-line) 0px,
      var(--crt-line) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }
  header{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 0 4px 10px 4px;
    letter-spacing: 2px;
  }
  .brand{
    font-size: 1.1rem; font-weight:bold;
    text-shadow: 0 0 6px var(--phosphor);
  }
  .brand .blink{ animation: blink 1.1s steps(2,start) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .hud{ font-size:0.85rem; color:var(--amber); text-shadow:0 0 6px var(--amber); }

  #boardWrap{
    border: 2px solid var(--phosphor-dim);
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(77,255,122,0.08) inset, 0 0 24px rgba(77,255,122,0.08);
    overflow:hidden;
    background: #04100a;
  }
  canvas{ display:block; width:100%; image-rendering: pixelated; }

  #footer{
    margin-top:14px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.7rem; color:var(--phosphor-dim);
    letter-spacing:1px;
  }

  #overlay{
    position:absolute; inset:18px;
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    background: rgba(4,16,10,0.92);
    border:2px solid var(--phosphor-dim);
    border-radius:6px;
    text-align:center;
    padding:24px;
  }
  #overlay h1{
    margin:0; font-size:1.3rem; letter-spacing:3px;
    text-shadow:0 0 10px var(--phosphor);
  }
  #overlay p{ margin:0; font-size:0.8rem; color:var(--phosphor-dim); max-width:260px; line-height:1.5; }
  button#startBtn{
    background:transparent;
    border:2px solid var(--phosphor);
    color:var(--phosphor);
    font-family: inherit;
    font-size:0.9rem;
    letter-spacing:2px;
    padding:10px 22px;
    border-radius:4px;
    cursor:pointer;
    text-shadow:0 0 6px var(--phosphor);
    box-shadow: 0 0 12px rgba(77,255,122,0.15);
  }
  button#startBtn:active{ background: rgba(77,255,122,0.12); }

  #touchpad{
    margin-top:16px;
    display:grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 50px 50px 50px;
    gap:6px;
    justify-content:center;
  }
  #touchpad button{
    background: rgba(77,255,122,0.05);
    border:1px solid var(--phosphor-dim);
    color:var(--phosphor);
    font-size:1.1rem;
    border-radius:6px;
  }
  #touchpad button:active{ background: rgba(77,255,122,0.2); }
  .tp-up{ grid-column:2; grid-row:1; }
  .tp-left{ grid-column:1; grid-row:2; }
  .tp-down{ grid-column:2; grid-row:3; }
  .tp-right{ grid-column:3; grid-row:2; }

  @media (hover:hover){ #touchpad{ opacity:0.55; } }
</style>
</head>
<body>
<div id="screen">
  <div class="crt-overlay"></div>
  <header>
    <div class="brand">SNAKE<span class="blink">_</span></div>
    <div class="hud" id="hud">SCORE 000 · BEST 000</div>
  </header>

  <div id="boardWrap">
    <canvas id="game" width="320" height="320"></canvas>
    <div id="overlay">
      <h1 id="ovTitle">READY?</h1>
      <p id="ovText">Swipe o usa le freccette per muoverti. Mangia i punti, non toccarti la coda e non sbattere le corna.</p>
      <button id="startBtn">START</button>
    </div>
  </div>

  <div id="footer">
    <span>SWIPE TO MOVE</span>
    <span id="speedTag">SPEED 1</span>
  </div>

  <div id="touchpad">
    <button class="tp-up">▲</button>
    <button class="tp-left">◀</button>
    <button class="tp-down">▼</button>
    <button class="tp-right">▶</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 16;
  const CELL = canvas.width / GRID;

  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const speedTag = document.getElementById('speedTag');

  let snake, dir, nextDir, food, score, best, running, tickMs, loopId, level;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);

  function reset(){
    snake = [ {x:8,y:8}, {x:7,y:8}, {x:6,y:8} ];
    dir = {x:1,y:0};
    nextDir = dir;
    score = 0;
    level = 1;
    tickMs = 140;
    placeFood();
    updateHud();
  }

  function placeFood(){
    let valid = false;
    while(!valid){
      food = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
      valid = !snake.some(s => s.x===food.x && s.y===food.y);
    }
  }

  function updateHud(){
    hud.textContent = `SCORE ${String(score).padStart(3,'0')} · BEST ${String(Math.max(best,score)).padStart(3,'0')}`;
    speedTag.textContent = `SPEED ${level}`;
  }

  function draw(){
    ctx.fillStyle = '#04100a';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // subtle grid
    ctx.strokeStyle = 'rgba(77,255,122,0.05)';
    ctx.lineWidth = 1;
    for(let i=1;i<GRID;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
    }

    // food
    ctx.fillStyle = '#ffb000';
    ctx.shadowColor = '#ffb000';
    ctx.shadowBlur = 10;
    const fp = 2;
    ctx.fillRect(food.x*CELL+fp, food.y*CELL+fp, CELL-fp*2, CELL-fp*2);
    ctx.shadowBlur = 0;

    // body (skip head, drawn separately)
    const n = snake.length;
    snake.forEach((s,i)=>{
      if(i===0) return;
      const isTail = i >= n-2; // last 2 segments
      ctx.fillStyle = isTail ? '#c9a86a' : '#e8d9b5';
      ctx.shadowColor = isTail ? '#c9a86a' : '#e8d9b5';
      ctx.shadowBlur = isTail ? 2 : 4;
      // taper the tail: shrink padding progressively on the last 2 blocks
      const p = isTail ? (i === n-1 ? CELL*0.28 : CELL*0.16) : 1.5;
      ctx.fillRect(s.x*CELL+p, s.y*CELL+p, CELL-p*2, CELL-p*2);
    });
    ctx.shadowBlur = 0;

    drawDogHead(snake[0], dir);
  }

  function drawDogHead(head, d){
    const cx = head.x*CELL + CELL/2;
    const cy = head.y*CELL + CELL/2;
    const angle = Math.atan2(d.y, d.x); // direction in radians

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.shadowColor = '#e8d9b5';
    ctx.shadowBlur = 8;

    const r = CELL/2 - 1;

    // head base (rounded square, snout points toward "forward" = +x in local space)
    ctx.fillStyle = '#efe2c2';
    ctx.beginPath();
    ctx.moveTo(-r, -r+2);
    ctx.lineTo(r*0.3, -r+2);
    ctx.quadraticCurveTo(r, -r*0.4, r, 0);
    ctx.quadraticCurveTo(r, r*0.4, r*0.3, r-2);
    ctx.lineTo(-r, r-2);
    ctx.closePath();
    ctx.fill();

    // ears (floppy, on the back side)
    ctx.fillStyle = '#c9a86a';
    ctx.beginPath();
    ctx.ellipse(-r*0.6, -r*0.95, r*0.35, r*0.55, -0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-r*0.6, r*0.95, r*0.35, r*0.55, 0.4, 0, Math.PI*2);
    ctx.fill();

    // snout tip
    ctx.fillStyle = '#f7efd9';
    ctx.beginPath();
    ctx.ellipse(r*0.75, 0, r*0.32, r*0.42, 0, 0, Math.PI*2);
    ctx.fill();

    // nose
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#06140a';
    ctx.beginPath();
    ctx.ellipse(r*0.95, 0, r*0.16, r*0.16, 0, 0, Math.PI*2);
    ctx.fill();

    // eyes
    ctx.fillStyle = '#06140a';
    ctx.beginPath();
    ctx.arc(r*0.05, -r*0.4, r*0.13, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(r*0.05, r*0.4, r*0.13, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }

  function step(){
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wrap or wall? classic = wall death
    if(head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID){
      return gameOver();
    }
    if(snake.some(s => s.x===head.x && s.y===head.y)){
      return gameOver();
    }

    snake.unshift(head);

    if(head.x===food.x && head.y===food.y){
      score++;
      if(score % 5 === 0 && tickMs > 60){
        tickMs -= 10;
        level++;
      }
      placeFood();
      updateHud();
    } else {
      snake.pop();
    }

    draw();
  }

  function loop(){
    step();
    if(running){
      loopId = setTimeout(loop, tickMs);
    }
  }

  function gameOver(){
    running = false;
    clearTimeout(loopId);
    if(score > best){
      best = score;
      localStorage.setItem('snake_best', String(best));
    }
    updateHud();
    ovTitle.textContent = 'GAME OVER';
    ovText.textContent = `Hai totalizzato ${score} punti. Tocca START per riprovare.`;
    overlay.style.display = 'flex';
  }

  function start(){
    reset();
    overlay.style.display = 'none';
    running = true;
    draw();
    loopId = setTimeout(loop, tickMs);
  }

  startBtn.addEventListener('click', start);

  // keyboard
  window.addEventListener('keydown', (e)=>{
    const map = {
      ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1},
      ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
      w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
    };
    const wanted = map[e.key];
    if(!wanted || !running) return;
    if(wanted.x === -dir.x && wanted.y === -dir.y) return; // no reverse
    nextDir = wanted;
  });

  // touch buttons
  function bindBtn(sel, vec){
    document.querySelector(sel).addEventListener('click', ()=>{
      if(!running) return;
      if(vec.x === -dir.x && vec.y === -dir.y) return;
      nextDir = vec;
    });
  }
  bindBtn('.tp-up', {x:0,y:-1});
  bindBtn('.tp-down', {x:0,y:1});
  bindBtn('.tp-left', {x:-1,y:0});
  bindBtn('.tp-right', {x:1,y:0});

  // swipe
  let touchStart = null;
  canvas.addEventListener('touchstart', (e)=>{
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, {passive:true});
  canvas.addEventListener('touchend', (e)=>{
    if(!touchStart || !running) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    let vec;
    if(Math.abs(dx) > Math.abs(dy)){
      vec = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
    } else {
      vec = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
    }
    if(vec.x === -dir.x && vec.y === -dir.y) return;
    nextDir = vec;
    touchStart = null;
  }, {passive:true});

  reset();
  draw();
  updateHud();
  overlay.style.display = 'flex';
})();
</script>
</body>
</html>
